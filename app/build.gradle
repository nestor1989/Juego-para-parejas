plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

def challengeHost = (project.findProperty("CHALLENGE_HOST") ?: "juego-para-parejas-3ea2c.web.app").toString()

// Pruebas de consentimiento (UMP) en debug. Se configuran en local.properties, que no se sube a git:
//   ump.debugGeography=EEA | US_STATE | OTHER   (vacío = ubicación real)
//   ump.testDeviceId=<hash que imprime Logcat>   (los emuladores ya cuentan como dispositivo de prueba)
//   ump.resetOnLaunch=true                       (borra el consentimiento guardado en cada arranque)
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) localPropsFile.withInputStream { localProps.load(it) }
def umpDebugGeography = localProps.getProperty("ump.debugGeography", "").trim()
def umpTestDeviceId = localProps.getProperty("ump.testDeviceId", "").trim()
def umpResetOnLaunch = localProps.getProperty("ump.resetOnLaunch", "false").trim().toBoolean()

android {
    namespace = "com.idea3d.juegoparaparejas"
    compileSdk = 36

    defaultConfig {
        applicationId = "com.idea3d.juegoparaparejas"
        minSdk = 23
        targetSdk = 36
        versionCode = 20
        versionName = "4.1.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "CHALLENGE_HOST", "\"${challengeHost}\""
        buildConfigField "String", "PRIVACY_POLICY_URL", "\"https://${challengeHost}/privacidad/\""
        manifestPlaceholders = [challengeHost: challengeHost]
    }

    buildTypes {
        debug {
            buildConfigField "String", "UMP_DEBUG_GEOGRAPHY", "\"${umpDebugGeography}\""
            buildConfigField "String", "UMP_TEST_DEVICE_ID", "\"${umpTestDeviceId}\""
            buildConfigField "boolean", "UMP_RESET_ON_LAUNCH", "${umpResetOnLaunch}"
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // En release nunca se fuerza la región ni se borra el consentimiento.
            buildConfigField "String", "UMP_DEBUG_GEOGRAPHY", "\"\""
            buildConfigField "String", "UMP_TEST_DEVICE_ID", "\"\""
            buildConfigField "boolean", "UMP_RESET_ON_LAUNCH", "false"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    // Compose
    implementation platform('androidx.compose:compose-bom:2025.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.activity:activity-compose:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'

    // Monetización
    implementation 'com.android.billingclient:billing-ktx:8.3.0'
    implementation 'com.google.android.gms:play-services-ads:23.2.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'

    // Crecimiento: deep link diferido y pedido de reseña
    implementation 'com.android.installreferrer:installreferrer:2.2'
    implementation 'com.google.android.play:review:2.0.2'

    // Firebase (mismo BOM que la 3.x)
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
